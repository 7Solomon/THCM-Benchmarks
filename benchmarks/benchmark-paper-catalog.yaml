# THCM-Fem benchmark paper catalog
# Generated 2026-08-17
# Papers whose published setup is usually complete enough for SKILLs/CREATE.md
# (geometry, materials, BCs, times, validation quantity).
#
# How to open a paper
#   doi:     https://doi.org/<doi>
#   url:     landing page if there is no DOI
#   crossref: https://search.crossref.org/?q=<query>
#   scholar:  https://scholar.google.com/scholar?q=<query>
# Never invent a DOI. Entries without doi use journal + query instead.
#
# physics: one of
#   hydromechanical | thermal-hydration | fracture | elastic
#   b3creep | drying-moisture | heatmoisturetransport
#
# completeness:
#   high   — numbers in the paper / closed-form
#   medium — paper + one cited annex/thesis usually enough
#   low    — setup clear but some knobs must be tagged ASSUMED

meta:
  pipeline: THCM-Fem / OOFEM backend
  skill: SKILLs/CREATE.md
  schema: SKILLs/benchmark.schema.json
  already_in_repo:
    - debug/HAMSTAD/B1
    - debug/HAMSTAD/B2
    - debug/HAMSTAD/B4
    - debug/bazant-najjar-1972-drying-cylinder
    - debug/briffaut-2010-civaux-wall
    - debug/ConCracksRestrainedBeam
    - debug/EarlyAgeThermalCracking
    - debug/HITEC
    - debug/BenVaSim/1.1
    - debug/ATENA

